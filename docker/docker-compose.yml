# Run from repo root with: docker compose --project-directory . -f docker/docker-compose.yml <cmd>
# --project-directory . anchors ./data, ./.env and build contexts at the repo root
# rather than at this file's own directory (docker/).
services:
  cli:
    build:
      context: .
      dockerfile: docker/Dockerfile.cli
    volumes:
      - ./data:/app/data
    command: ["run"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    profiles: ["backend"]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./data:/app/data
    profiles: ["backend"]
    restart: unless-stopped
