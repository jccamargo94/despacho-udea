services:
  cli:
    build: .
    volumes:
      - ./data:/app/data
    command: ["run"]

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    profiles: ["backend"]

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./data:/app/data
    profiles: ["backend"]
